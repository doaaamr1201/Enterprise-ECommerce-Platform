spring.application.name=notification-service
server.port=8085
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
management.endpoints.web.exposure.include=health,info

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.microservices.pro.*
spring.kafka.consumer.properties.spring.json.type.mapping=\
  paymentCompleted:com.microservices.pro.notificationservice.event.PaymentCompletedEvent,\
  paymentFailed:java.lang.Object,\
  inventoryReserved:java.lang.Object,\
  inventoryReservationFailed:com.microservices.pro.notificationservice.event.InventoryReservationFailedEvent,\
  inventoryReleased:com.microservices.pro.notificationservice.event.InventoryReleasedEvent
