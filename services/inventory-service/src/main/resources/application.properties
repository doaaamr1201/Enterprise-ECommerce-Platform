spring.application.name=inventory-service
server.port=8084
spring.config.import=optional:configserver:
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ===== Kafka (Saga) =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=\
  inventoryReserved:com.microservices.pro.inventoryservice.event.InventoryReservedEvent,\
  inventoryReservationFailed:com.microservices.pro.inventoryservice.event.InventoryReservationFailedEvent,\
  inventoryReleased:com.microservices.pro.inventoryservice.event.InventoryReleasedEvent,\
  inventoryResult:com.microservices.pro.inventoryservice.event.InventoryResultEvent
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.microservices.pro.*
spring.kafka.consumer.properties.spring.json.type.mapping=\
  orderPlaced:com.microservices.pro.inventoryservice.event.OrderPlacedEvent,\
  paymentCompleted:com.microservices.pro.inventoryservice.event.PaymentCompletedEvent,\
  paymentFailed:com.microservices.pro.inventoryservice.event.PaymentFailedEvent,\
  reserveInventoryCommand:com.microservices.pro.inventoryservice.event.ReserveInventoryCommand,\
  releaseInventoryCommand:com.microservices.pro.inventoryservice.event.ReleaseInventoryCommand,\
  processPaymentCommand:java.lang.Object

# ===== Tracing (Session 17) =====
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
